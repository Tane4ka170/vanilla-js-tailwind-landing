<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master in Programming with AI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-slate-50 dark:[#050c18] text-slate-800 dark:text-slate-200 font-body transition-colors duration-300"
  >
    <div
      id="progressBar"
      class="progress-bar fixed top-0 left-0 right-0 z-[200]"
    ></div>

    <nav
      id="navBar"
      class="fixed top-0 left-0 right-0 z-[100] transition-all duration-300 py-4"
    >
      <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
        <!-- Logo -->
        <div class="flex items-center gap-2">
          <img src="assets/logo.png" alt="k-2-logo" class="w-full h-full" />
        </div>

        <!-- Nav links desktop -->
        <div class="hidden md:flex items-center gap-8 text-sm font-medium">
          <a href="#course" class="hover:text-cyne-500 transition-colors"
            >Courses</a
          >
          <a href="#features" class="hover:text-cyne-500 transition-colors"
            >Features</a
          >
          <a href="#testimonail" class="hover:text-cyne-500 transition-colors"
            >Reviews</a
          >
          <a href="#more-courses" class="hover:text-cyne-500 transition-colors"
            >More Courses</a
          >
          <a href="#contact" class="hover:text-cyne-500 transition-colors"
            >Contact</a
          >
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-3">
          <!-- Dark mode toggle -->
          <button
            id="themeToggle"
            class="w-9 h-9 rounded-full border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:scale-110 transition-transform bg-white dark:bg-slate-800"
          >
            <span id="moonIcon"><i class="fa-solid fa-moon"></i></span>
            <span id="sunIcon" class="hidden"
              ><i class="fa-solid fa-sun"></i
            ></span>
          </button>

          <a
            href="#"
            class="hidden mx:block px-5 py-2 rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-sm font-semibold hover:opacity-90 hover:scale-105 transition-all shadow-lg shadow-cyan-500/30"
            >Enroll Now</a
          >

          <!-- Hamburger -->
          <button
            id="menuBtn"
            class="md:hidden w-9 h-9 flex flex-col items-center gap-1.5 cursor-pointer"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <!-- Mobile menu -->
      <div
        id="mobileMenu"
        class="hidden md:hidden glass mx-4 mt-3 rounded-2xl p-5"
      >
        <div class="flex flex-col gap-4 text-sm font-medium">
          <a
            href="#course"
            class="hover:text-cyne-500 transition-colors"
            onclick="closeMobile()"
            >Courses</a
          >
          <a
            href="#features"
            class="hover:text-cyne-500 transition-colors"
            onclick="closeMobile()"
            >Features</a
          >
          <a
            href="#testimonail"
            class="hover:text-cyne-500 transition-colors"
            onclick="closeMobile()"
            >Reviews</a
          >
          <a
            href="#more-courses"
            class="hover:text-cyne-500 transition-colors"
            onclick="closeMobile()"
            >More Courses</a
          >
          <a
            href="#contact"
            class="hover:text-cyne-500 transition-colors"
            onclick="closeMobile()"
            >Contact</a
          >
          <a
            href="#"
            class="px-5 py-2 rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-center font-semibold"
            onclick="openModel(event)"
            >Enroll Now</a
          >
        </div>
      </div>
    </nav>

    <section class="relative min-h-screen overflow-hidden grid-bg noise pt-20">
      <!-- Blobs -->
      <div
        class="blob absolute -top-40 -left-40 w-[500px] h-[500px] bg-cyan-400/10 dark:bg-cyan-500/15 blur-3xl pointer-events-none"
      ></div>

      <div
        class="blob absolute -bottom-40 -right-40 w-[600px] h-[600px] bg-purple-500/10 dark:bg-purple-500/15 blur-3xl pointer-events-none"
        style="animation-delay: 3s"
      ></div>

      <div
        class="blob absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-pink-400/8 dark:bg-pink-500/10 blur-3xl pointer-events-none"
        style="animation-delay: 5s"
      ></div>

      <!-- Orbit decorations -->
      <div
        class="orbit absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] hidden lg:block animate-spin-slow opacity-30"
      ></div>
      <div
        class="orbit absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] hidden lg:block animate-spin-slow opacity-20"
        style="animation-direction: reverse; animation-duration: 30s"
      ></div>

      <!-- Floating code particles -->
      <div
        class="absolute inset-0 overlow-hidden pointer-events-none selec-none hidden md:block"
      >
        <div
          class="absolute top-24 left-[8%] text-cyan-400/80 dark:text-cyan-400/40 font-mono text-sm animate-float"
        >
          {'AI':True}
        </div>
        <div
          class="absolute top-24 right-[12%] text-purple-400/80 dark:text-purple-400/40 font-mono text-sm animate-float2"
        >
          print('Hello World')
        </div>
        <div
          class="absolute bottom-32 right-[15%] text-pink-400/80 dark:text-pink-400/40 font-mono text-sm animate-float3"
        >
          for i in range(∞)
        </div>
        <div
          class="absolute bottom-24 right-[8%] text-cyan-400/80 dark:text-cyan-400/40 font-mono text-sm animate-float"
        >
          int max(){}
        </div>
        <div
          class="absolute top-1/3 left-[3%] text-purple-400/80 dark:text-purple-400/40 font-mono text-sm animate-float2"
        >
          #include &lt;future
        </div>
      </div>
    </section>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
